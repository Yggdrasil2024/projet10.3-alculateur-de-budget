<body>
    <header class="header">
        <div class="container">
            <div class="header__caption">
                <img src="https://placehold.co/150x150/png" alt="icone de l'app">
                <h1>Budget kit</h1>
            </div>

            <div class="header__account_area">
                <span>Mon compte</span>
                <img src="https://placehold.co/150x150/png" alt="profil photo">
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <section class="dashboard">
                <div class="cards">
                    <article class="card">
                        <span class="card-info">solde total</span>
                        <h2 id="balance" class="balance">1 400,00 eur</h2>
                        <p>mise à jour en temps réel - compte principal</p>
                    </article>
                    <article class="card">
                        <span class="card-info">total revenus</span>
                        <h2 id="earnings" class="earnings">+3 300,00 eur</h2>
                    </article>
                    <article class="card">
                        <span class="card-info">total des dépenses</span>
                        <h2 id="expenses" class="expenses">-1 900,00 eur</h2>
                    </article>
                </div>
                <form id="operation_formular">
                    <h3>Nouvelle operation</h3>
                    <div class="form-field-container">
                        <label for="operation_title">titre</label>
                        <input placeholder="ex: loyer" type="text" name="operation_title" id="operation_title" required>
                    </div>
                    <div class="form-field-container">
                        <label for="operation_amount">Montant</label>
                        <input placeholder="ex: 1000 XAF" type="number" step="0.01" name="operation_amount"
                            id="operation_amount" required>
                    </div>
                    <div class="form-field-container">
                        <label for="operation_type">type</label>
                        <select name="operation_type" id="operation_type">
                            <option value="1" selected>Dépense</option>
                            <option value="2">Revenu</option>
                        </select>
                    </div>
                    <div class="form-field-container">
                        <button type="submit">Ajouter l'operation</button>
                    </div>
                </form>
            </section>

            <section class="operation">
                <div class="operations__info">
                    <div class="operation__header">
                        <h3>Operations recentes</h3>
                        <span id="sum-badge" class="badge"></span>
                    </div>
